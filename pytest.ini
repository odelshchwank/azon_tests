[pytest]
addopts = -v --strict-markers
pythonpath = .
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
markers =
    smoke: быстрая проверка, что стенд жив и главные сценарии работают
    regression: полный регресс, гоняем перед релизом
    auth: тесты Auth API - регистрация и вход
    users: тесты User API - профиль пользователя
    products: тесты Product API - каталог и CRUD товаров
    payment: тесты Payment API - заказы и платежи
    negative: негативные сценарии - ошибки, валидация, чужие права
    roles: проверки прав по ролям USER / MANAGER / ADMIN
    slow: медленные тесты, в быстрый прогон не берём
    unstable: нестабильные тесты, причина нестабильности ещё не найдена
    contract: ответ целиком проверяется моделью - следим за контрактом API